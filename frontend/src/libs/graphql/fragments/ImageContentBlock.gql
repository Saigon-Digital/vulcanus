fragment ImageContent on PageBuilderDynamicBlocksImageContentLayout_Fields {
  fieldGroupName
  reverse
  fullWidthLayout
  image {
    node {
      sourceUrl
    }
  }
  contentGroup {
    description
    icons {
      text
      icon {
        node {
          sourceUrl
        }
      }
    }
    title
  }
  blockSettings {
    ...BlockSettings
  }
}
